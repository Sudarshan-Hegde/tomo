[package]
name = "tomo-web"
edition.workspace = true
version.workspace = true

[dependencies]
console_error_panic_hook = "0.1.7"
futures = "0.3.34"
gloo-net = { version = "0.8.0", features = ["http", "json", "websocket"] }
gloo-timers = { version = "0.4.1", features = ["futures"] }
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
leptos_router = "0.8.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tomo-shared = { version = "0.1.0", path = "../shared" }
web-sys = { version = "0.3.107", features = ["Window", "Storage", "Document", "Element"] }
