[package]
name = "tomo-api"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
tokio = { version = "1.54.1", features = ["full"] }
tomo-shared = { version = "0.1.0", path = "../shared" }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
